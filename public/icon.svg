<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- App Icon Background with Safe Radius -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Subtle Acoustic Wave Arc (Ultrasound Cone) -->
  <path d="M128 390 A 200 200 0 0 1 384 390" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-dasharray="12 12"/>
  <path d="M168 360 A 150 150 0 0 1 344 360" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="6"/>
  
  <!-- Loving Mother and Fetal Heart Protection Symbol -->
  <g transform="translate(256, 240)">
    <!-- Mother silhouette arc -->
    <path d="M-80 -40 C-80 -100, 20 -110, 60 -70 C90 -40, 95 10, 70 60 C40 120, -50 140, -80 70" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Baby womb contour -->
    <circle cx="10" cy="15" r="48" fill="rgba(255,255,255,0.12)" stroke="#ffffff" stroke-width="8"/>
    
    <!-- Fetal Heart Pulse (Cardiogram Accent) -->
    <path d="M-22 15 L-10 15 L-4 2 L4 28 L10 6 L16 15 L32 15" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Star of life / fetal medicine dot -->
    <circle cx="56" cy="-60" r="14" fill="#fb7185"/>
  </g>
  
  <!-- Wordmark Accent -->
  <text x="256" y="440" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="28" fill="#ffffff" letter-spacing="4">FETALCARE</text>
  <text x="256" y="468" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="16" fill="rgba(255,255,255,0.7)" letter-spacing="2">UAE · MFM CLINIC</text>
</svg>
